<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Lincah Travel Admin - Offline</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #f9fafb;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .offline-container {
      background: white;
      border-radius: 16px;
      padding: 40px 24px;
      max-width: 360px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      background: #fee2e2;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }
    .offline-icon .material-icons-round {
      font-size: 40px;
      color: #dc2626;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 28px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-family: inherit;
    }
    .btn:hover { background: #1d4ed8; }
    .btn .material-icons-round { font-size: 20px; }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">
      <span class="material-icons-round">wifi_off</span>
    </div>
    <h1>Tidak Ada Koneksi Internet</h1>
    <p>Periksa koneksi internet Anda dan coba lagi.</p>
    <button class="btn" onclick="location.reload()">
      <span class="material-icons-round">refresh</span>
      Muat Ulang
    </button>
  </div>
</body>
</html>
