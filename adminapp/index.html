<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="description" content="Lincah Travel Admin - Aplikasi Pencatatan Pendapatan dan Pengeluaran">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LincahAdmin">
  <meta name="mobile-web-app-capable" content="yes">
  
  <title>Lincah Travel Admin</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'plus': ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            primary: '#2563eb',
            'primary-dark': '#1d4ed8',
            'primary-light': '#3b82f6',
          }
        }
      }
    }
  </script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  
  <!-- jsPDF + html2canvas (for PDF generation) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <!-- QRCode.js (for generating QR codes) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/lincah/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/lincah/assets/icons/icon-192.png">
</head>
<body class="font-plus bg-gray-50">
  <div id="app">
    <!-- Halaman dimuat di sini -->
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

  <!-- Modal Container -->
  <div id="modal-container"></div>

  <!-- JavaScript Modules -->
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/dates.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/icons.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/cards.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/tables.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/bottomnav.js"></script>
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/passengers.js"></script>
  <script src="js/pages/vendors.js"></script>
  <script src="js/pages/expenses.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/logs.js"></script>
  <script src="js/pages/notas.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
